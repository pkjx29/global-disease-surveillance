# Data pipeline: ETL from the public sources into PostgreSQL, then XGBoost training and scoring.
# The Job bootstraps a fresh cluster; the CronJob refreshes data and re-trains every week.
apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-bootstrap
  labels: { app: pipeline }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: pipeline, surveillance/db-client: "true" }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 3; done"]
      containers:
        - name: pipeline
          image: disease-surveillance/backend
          command: ["python", "-m", "pipeline", "all"]
          envFrom:
            - configMapRef: { name: surveillance-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: surveillance-db, key: DATABASE_URL } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: scratch, mountPath: /app/data }
            - { name: models, mountPath: /app/models }
      volumes:
        - { name: scratch, emptyDir: {} }
        - { name: models, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-weekly
  labels: { app: pipeline }
spec:
  schedule: "0 3 * * 1"          # Mondays 03:00 UTC, after the weekly WHO update
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: pipeline, surveillance/db-client: "true" }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pipeline
              image: disease-surveillance/backend
              command: ["python", "-m", "pipeline", "all", "--force"]
              envFrom:
                - configMapRef: { name: surveillance-config }
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: surveillance-db, key: DATABASE_URL } }
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits: { memory: 2Gi }
              volumeMounts:
                - { name: scratch, mountPath: /app/data }
                - { name: models, mountPath: /app/models }
          volumes:
            - { name: scratch, emptyDir: {} }
            - { name: models, emptyDir: {} }
